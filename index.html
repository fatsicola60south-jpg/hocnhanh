<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bản quyền của PHÁT - Flashcard Học Thuộc SOP Ngô Gia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0267b5;
      --primary-dark: #0a385c;
      --primary-light: #e0f2fe;
      --accent: #0284c7;
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 85px; min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white; padding: 12px 16px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(2, 103, 181, 0.25);
    }
    .header-box { display: flex; align-items: center; justify-content: space-between; max-width: 650px; margin: 0 auto; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      background: white; color: var(--primary); width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.3rem; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .brand-title { font-size: 1.05rem; font-weight: 900; letter-spacing: -0.3px; line-height: 1.2; }
    .brand-sub { font-size: 0.72rem; color: #7dd3fc; margin-top: 1px; font-weight: 600; }

    /* ACTIVE RECALL TOGGLE BUTTON */
    .btn-recall-toggle {
      background: #f59e0b; color: #78350f; border: none; padding: 6px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: 0.2s;
    }
    .btn-recall-toggle.active { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }

    .container { padding: 12px; max-width: 650px; margin: 0 auto; }

    /* TOP BAR: SEARCH & PROGRESS */
    .top-controls {
      background: white; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .search-select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 0.88rem; font-weight: 800; color: var(--primary-dark); background: white; outline: none; margin-bottom: 8px;
    }
    .progress-bar-wrap {
      display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    }
    .progress-bg { flex: 1; height: 7px; background: #e2e8f0; border-radius: 10px; margin: 0 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

    /* CARD RECIPE SHEET (ALL-IN-ONE) */
    .recipe-sheet {
      background: white; border-radius: 16px; border: 1.5px solid #cbd5e1; padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .sheet-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 12px;
    }
    .sheet-title { font-size: 1.25rem; font-weight: 900; color: var(--primary-dark); line-height: 1.25; }
    .sheet-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px;
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    }
    .badge-no-shake { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-shake { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-stir { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-size { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .btn-fav {
      background: #f8fafc; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 8px 10px; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .btn-fav.learned { background: #ecfdf5; border-color: var(--success); color: var(--success); }

    /* SECTIONS INSIDE SHEET */
    .section-block { margin-bottom: 14px; }
    .section-title {
      font-size: 0.76rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }

    /* MATRIX TABLES */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { background: #f0f7ff; color: var(--primary-dark); padding: 8px; border: 1px solid #e2e8f0; font-weight: 800; text-align: left; white-space: nowrap; }
    td { padding: 7px 8px; border: 1px solid #e2e8f0; font-weight: 700; color: #1e293b; }
    tr:nth-child(even) td { background: #fbfdff; }

    /* PROCEDURES & NOTES */
    .proc-box {
      background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 10px 12px;
      font-size: 0.85rem; font-weight: 700; color: #1e293b; line-height: 1.55;
    }
    .note-box {
      background: #fffbeb; border-left: 4px solid var(--warning); border-radius: 8px; padding: 8px 12px;
      font-size: 0.8rem; font-weight: 700; color: #92400e; margin-top: 8px; line-height: 1.45;
    }
    .hack-box {
      background: #eff6ff; border-left: 4px solid var(--primary); border-radius: 8px; padding: 8px 12px;
      font-size: 0.8rem; font-weight: 800; color: var(--primary-dark); margin-top: 8px; line-height: 1.45;
    }

    /* ACTIVE RECALL BLIND EFFECT */
    .blind-mode .maskable {
      background: #e2e8f0 !important; color: transparent !important; user-select: none;
      border-radius: 4px; cursor: pointer; position: relative; transition: 0.15s; display: inline-block; min-width: 35px;
    }
    .blind-mode .maskable::after {
      content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #64748b; font-weight: 900; font-size: 0.8rem;
    }
    .blind-mode .maskable.revealed {
      background: #dcfce7 !important; color: #065f46 !important;
    }
    .blind-mode .maskable.revealed::after { content: ""; }

    /* BOTTOM CONTROLS FOR FLASHCARD FLIPPING */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: white;
      border-top: 1.5px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.08); max-width: 650px; margin: 0 auto;
    }
    .nav-btn {
      padding: 10px 18px; border-radius: 12px; border: none; font-weight: 800; font-size: 0.88rem;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.15s;
    }
    .nav-btn-prev { background: #f1f5f9; color: #334155; }
    .nav-btn-next { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(2, 103, 181, 0.25); }
    .nav-counter { font-size: 0.82rem; font-weight: 900; color: var(--primary-dark); }
  </style>
</head>
<body>

  <header>
    <div class="header-box">
      <div class="header-left">
        <div class="brand-logo">吳</div>
        <div>
          <div class="brand-title">Bản quyền của PHÁT</div>
          <div class="brand-sub">Học Thuộc SOP 1-Trang • Tránh xa tủ đông</div>
        </div>
      </div>
      <button class="btn-recall-toggle" id="btn-blind" onclick="toggleBlindMode()">
        <i class="fa-solid fa-eye-slash"></i> <span>Che Số Tự Học</span>
      </button>
    </div>
  </header>

  <div class="container" id="main-content">

        <!-- Options generated by JS -->
      </select>
      <div class="progress-bar-wrap">
        <span>Tiến độ thuộc:</span>
        <div class="progress-bg"><div class="progress-fill" id="learned-progress"></div></div>
        <span id="learned-count">0/26</span>
      </div>
    </div>

    <!-- MAIN ALL-IN-ONE CARD -->
    <div id="card-display" class="recipe-sheet">
      <!-- Full recipe loaded here -->
    </div>

  </div>

  <!-- BOTTOM BAR FOR FAST FLASHCARD FLIPPING -->
  <div class="bottom-bar">
    <button class="nav-btn nav-btn-prev" onclick="navDrink(-1)"><i class="fa-solid fa-arrow-left"></i> Trước</button>
    <div class="nav-counter" id="card-counter">1 / 26</div>
    <button class="nav-btn nav-btn-next" onclick="navDrink(1)">Tiếp <i class="fa-solid fa-arrow-right"></i></button>
  </div>

      const sel = document.getElementById('drink-selector');
      sel.innerHTML = '';
      DRINKS.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${d.name}`;
        sel.appendChild(opt);
      });

      renderCard();
      updateProgress();
    }

      const d = DRINKS[currentIdx];
      const isLearned = learnedList.includes(d.id);

              <table>
                <thead><tr><th>Đường</th><th>Rót Ly PP (Đá thường)</th><th>Ca Đong (Ít/Không đá)</th></tr></thead>
                <tbody>${trL}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      display.innerHTML = `
        <div class="sheet-header">
          <div>
            <div class="sheet-title">${currentIdx + 1}. ${d.name}</div>
            <div class="sheet-tags">
              <span class="badge ${d.actionClass}"><span class="maskable" onclick="revealMask(this)">${d.action}</span></span>
              <span class="badge badge-size">${d.sizes}</span>
            </div>
          </div>
          <button class="btn-fav ${isLearned ? 'learned' : ''}" onclick="toggleLearned('${d.id}')">
            <i class="fa-solid fa-star"></i> <span>${isLearned ? 'Đã thuộc' : 'Chưa thuộc'}</span>
          </button>
        </div>

        <!-- MỨC ĐÁ -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-snowflake" style="color:var(--accent);"></i> QUY CHUẨN ĐÁ (TẤT CẢ MỨC):</div>
          <div style="font-size:0.83rem; line-height:1.5; color:#334155;">
            <strong>• Ly M:</strong> <span class="maskable" onclick="revealMask(this)">${d.ice_M}</span><br>
            ${d.ice_L !== 'Không áp dụng' ? `<strong>• Ly L:</strong> <span class="maskable" onclick="revealMask(this)">${d.ice_L}</span>` : ''}
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG LY M -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-cubes-stacked" style="color:var(--primary);"></i> ĐỊNH LƯỢNG LY M (700cc) - TẤT CẢ MỨC ĐƯỜNG:</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Đường</th><th>Rót Ly PP (Đá thường)</th><th>Ca Đong (Ít/Không đá)</th></tr></thead>
              <tbody>${trM}</tbody>
            </table>
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG LY L -->
        ${tableLHtml}

        <!-- QUY TRÌNH -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-list-ol" style="color:var(--success);"></i> TRÌNH TỰ PHA CHẾ CHUẨN:</div>
          <div class="proc-box"><span class="maskable" onclick="revealMask(this)">${d.procedure}</span></div>
        </div>

        <!-- LƯU Ý & MẸO NHỚ -->
        ${d.notes ? `<div class="note-box"><i class="fa-solid fa-triangle-exclamation"></i> <strong>LƯU Ý:</strong> ${d.notes}</div>` : ''}
        <div class="hack-box"><i class="fa-solid fa-lightbulb"></i> ${d.hack}</div>
      `;

      if (isBlindMode) {
        document.getElementById('card-display').classList.add('blind-mode');
      } else {
        document.getElementById('card-display').classList.remove('blind-mode');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navDrink(step) {
      currentIdx += step;
      if (currentIdx < 0) currentIdx = DRINKS.length - 1;
      if (currentIdx >= DRINKS.length) currentIdx = 0;
      renderCard();
    }

    function jumpToDrink(idx) {
      currentIdx = parseInt(idx);
      renderCard();
    }

    function toggleBlindMode() {
      isBlindMode = !isBlindMode;
      const btn = document.getElementById('btn-blind');
      if (isBlindMode) {
        btn.classList.add('active');
        btn.innerHTML = `<i class="fa-solid fa-eye"></i> <span>Mở Số Lại</span>`;
      } else {
        btn.classList.remove('active');
        btn.innerHTML = `<i class="fa-solid fa-eye-slash"></i> <span>Che Số Tự Học</span>`;
      }
      renderCard();
    }

    function revealMask(el) {
      if (isBlindMode) {
        el.classList.toggle('revealed');
      }
    }

    function toggleLearned(id) {
      if (learnedList.includes(id)) {
        learnedList = learnedList.filter(item => item !== id);
      } else {
        learnedList.push(id);
      }
      localStorage.setItem('ngogia_learned', JSON.stringify(learnedList));
      updateProgress();
      renderCard();
    }

    function updateProgress() {
      const count = learnedList.length;
      const total = DRINKS.length;
      const pct = Math.round((count / total) * 100);
      document.getElementById('learned-progress').style.width = pct + '%';
      document.getElementById('learned-count').textContent = `${count}/${total} món (${pct}%)`;
    }

    window.onload = init;
  </script>
</body>
</html>
