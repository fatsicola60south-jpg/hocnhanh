<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bản quyền của PHÁT - SOP Ngô Gia Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0267b5;
      --primary-dark: #0a385c;
      --accent: #0284c7;
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 75px; min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white; padding: 10px 14px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 12px rgba(2, 103, 181, 0.25);
    }
    .header-box { display: flex; align-items: center; justify-content: space-between; max-width: 500px; margin: 0 auto; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .brand-logo {
      background: white; color: var(--primary); width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; flex-shrink: 0;
    }
    .brand-title { font-size: 0.95rem; font-weight: 900; line-height: 1.15; }
    .brand-sub { font-size: 0.65rem; color: #7dd3fc; font-weight: 600; }

    .btn-top-topping {
      background: #38bdf8; color: #082f49; border: none; padding: 5px 10px; border-radius: 16px;
      font-size: 0.72rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    .container { padding: 10px; max-width: 500px; margin: 0 auto; }

    /* CONTROLS: GỌN GÀNG TRÊN 1 DÒNG */
    .top-controls {
      background: white; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px;
      border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .search-select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 0.85rem; font-weight: 800; color: var(--primary-dark); background: white; outline: none; margin-bottom: 8px;
    }
    .tools-row { display: flex; gap: 6px; }
    .tool-btn {
      flex: 1; padding: 7px 4px; border-radius: 8px; border: 1.5px solid #cbd5e1; background: #f8fafc;
      font-size: 0.74rem; font-weight: 800; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.15s;
    }
    .tool-btn.active-blind { background: #fef3c7; border-color: var(--warning); color: #b45309; }
    .tool-btn.active-cloze { background: #f3e8ff; border-color: var(--purple); color: #6b21a8; }

    /* THANH BÁO ĐỤC LỖ */
    .cloze-bar {
      display: none; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px;
      padding: 6px 10px; margin-bottom: 8px; font-size: 0.75rem; font-weight: 800; color: #6b21a8;
      align-items: center; justify-content: space-between;
    }
    .btn-cloze-sub {
      background: #8b5cf6; color: white; border: none; border-radius: 6px; padding: 3px 6px; font-size: 0.7rem; font-weight: 800; cursor: pointer;
    }

    /* CARD RECIPE */
    .recipe-sheet {
      background: white; border-radius: 14px; border: 1.5px solid #cbd5e1; padding: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.03);
    }
    .sheet-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;
      border-bottom: 1.5px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 10px;
    }
    .sheet-title { font-size: 1.05rem; font-weight: 900; color: var(--primary-dark); line-height: 1.25; }
    .sheet-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 5px;
      font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
    }
    .badge-no-shake { background: #fee2e2; color: #991b1b; }
    .badge-shake { background: #dbeafe; color: #1e40af; }
    .badge-stir { background: #fef3c7; color: #92400e; }
    .badge-size { background: #f1f5f9; color: #475569; }

    .btn-fav {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 8px; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .btn-fav.learned { background: #ecfdf5; border-color: var(--success); color: var(--success); }

    .section-block { margin-bottom: 10px; }
    .section-title {
      font-size: 0.72rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;
      margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;
    }

    /* BẢNG NGAY NGẮN CHUẨN ĐIỆN THOẠI */
    .table-wrap { border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: center; }
    th { background: #f0f7ff; color: var(--primary-dark); padding: 6px 4px; border: 1px solid #e2e8f0; font-weight: 800; font-size: 0.72rem; }
    td { padding: 5px 4px; border: 1px solid #e2e8f0; font-weight: 700; color: #1e293b; height: 32px; vertical-align: middle; }
    tr:nth-child(even) td { background: #fbfdff; }

    /* Ô CHE SỐ & Ô ĐỤC LỖ CỐ ĐỊNH CHIỀU CAO - THẲNG TẮP */
    .val-highlight { font-weight: 800; color: var(--primary); }
    
    .maskable {
      display: inline-block; min-width: 42px; height: 22px; line-height: 22px; padding: 0 4px;
      border-radius: 5px; font-weight: 800; vertical-align: middle; text-align: center;
    }
    .mode-blind .maskable {
      background: #e2e8f0 !important; color: transparent !important; user-select: none;
      cursor: pointer; position: relative; border: 1px dashed #94a3b8;
    }
    .mode-blind .maskable::after {
      content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #64748b; font-weight: 900; font-size: 0.75rem;
    }
    .mode-blind .maskable.revealed {
      background: #dcfce7 !important; color: #065f46 !important; border: 1px solid #10b981;
    }
    .mode-blind .maskable.revealed::after { content: ""; }

    /* Ô NHẬP ĐỤC LỖ */
    .cloze-input {
      display: inline-block; width: 48px; height: 22px; line-height: 22px; text-align: center;
      font-size: 0.78rem; font-weight: 800; border-radius: 5px; border: 1.5px solid #cbd5e1;
      vertical-align: middle; padding: 0; outline: none; background: #fff;
    }
    .cloze-input:focus { border-color: var(--accent); }
    .cloze-input.correct { background: #dcfce7 !important; border-color: #10b981 !important; color: #065f46 !important; }
    .cloze-input.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

    /* KHỐI KÉO THẢ QUY TRÌNH (DRAG-AND-DROP STEP SORTER) */
    .steps-container { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
    .step-item {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 7px 8px;
      font-size: 0.78rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; justify-content: space-between;
      user-select: none; transition: 0.15s; touch-action: manipulation;
    }
    .step-item.selected { border-color: var(--primary); background: #e0f2fe; }
    .step-item.correct-seq { border-color: #10b981; background: #ecfdf5; color: #065f46; font-weight: 800; }
    
    .step-left { display: flex; align-items: center; gap: 6px; flex: 1; }
    .drag-handle { color: #94a3b8; font-size: 0.85rem; cursor: grab; padding-right: 4px; }
    .step-arrows { display: flex; gap: 2px; }
    .btn-step-move {
      background: white; border: 1px solid #cbd5e1; width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: #475569; cursor: pointer;
    }

    .seq-feedback {
      font-size: 0.72rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-align: center; margin-top: 4px;
    }
    .seq-correct { background: #dcfce7; color: #065f46; border: 1px solid #a7f3d0; }
    .seq-scrambled { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    /* HỘP MẸO & LƯU Ý */
    .note-box {
      background: #fffbeb; border-left: 3px solid var(--warning); border-radius: 6px; padding: 6px 8px;
      font-size: 0.74rem; font-weight: 700; color: #92400e; margin-top: 6px; line-height: 1.4;
    }
    .hack-box {
      background: #eff6ff; border-left: 3px solid var(--primary); border-radius: 6px; padding: 6px 8px;
      font-size: 0.74rem; font-weight: 800; color: var(--primary-dark); margin-top: 6px; line-height: 1.4;
    }

    /* FOOTER NAV */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white;
      border-top: 1.5px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center;
      padding: 0 14px; z-index: 1000; box-shadow: 0 -3px 10px rgba(0,0,0,0.06); max-width: 500px; margin: 0 auto;
    }
    .nav-btn {
      padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.82rem;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .nav-btn-prev { background: #f1f5f9; color: #334155; }
    .nav-btn-next { background: var(--primary); color: white; }
    .nav-counter { font-size: 0.78rem; font-weight: 900; color: var(--primary-dark); }

    /* MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65);
      z-index: 2000; display: none; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-box {
      background: white; border-radius: 14px; width: 100%; max-width: 450px; max-height: 80vh;
      overflow-y: auto; padding: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;
    }
    .modal-title { font-size: 0.92rem; font-weight: 900; color: var(--primary-dark); }
    .btn-close-modal { background: #e2e8f0; border: none; width: 26px; height: 26px; border-radius: 50%; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-box">
      <div class="header-left">
        <div class="brand-logo">吳</div>
        <div>
          <div class="brand-title">Bản quyền của PHÁT</div>
          <div class="brand-sub">Tránh xa tủ đông cùng Phát nhé</div>
        </div>
      </div>
      <button class="btn-top-topping" onclick="openToppingModal()">
        <i class="fa-solid fa-boxes-stacked"></i> <span>20 Topping</span>
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- THANH CHỌN MÓN & 2 NÚT THAO TÁC GỌN GÀNG -->
    <div class="top-controls">
      <select id="drink-selector" class="search-select" onchange="jumpToDrink(this.value)"></select>
      
      <div class="tools-row">
        <button class="tool-btn" id="btn-toggle-blind" onclick="toggleMode('blind')">
          <i class="fa-solid fa-eye-slash"></i> <span>Che Số</span>
        </button>
        <button class="tool-btn" id="btn-toggle-cloze" onclick="toggleMode('cloze')">
          <i class="fa-solid fa-pen-to-square"></i> <span>Đục Lỗ</span>
        </button>
      </div>
    </div>

    <!-- THANH THỐNG KÊ ĐỤC LỖ -->
    <div class="cloze-bar" id="cloze-bar">
      <div><i class="fa-solid fa-pen-nib"></i> <span id="cloze-score-text">Đúng: 0 / 0 ô</span></div>
      <div style="display:flex; gap:4px;">
        <button class="btn-cloze-sub" onclick="showClozeAnswers()"><i class="fa-solid fa-key"></i> Đáp Án</button>
        <button class="btn-cloze-sub" style="background:#cbd5e1; color:#334155;" onclick="resetClozeInputs()"><i class="fa-solid fa-rotate-left"></i> Xóa</button>
      </div>
    </div>

    <!-- THẺ CÔNG THỨC DUY NHẤT -->
    <div id="card-display" class="recipe-sheet"></div>

  </div>

  <!-- FOOTER -->
  <div class="bottom-bar">
    <button class="nav-btn nav-btn-prev" onclick="navDrink(-1)"><i class="fa-solid fa-arrow-left"></i> Trước</button>
    <div class="nav-counter" id="card-counter">1 / 27</div>
    <button class="nav-btn nav-btn-next" onclick="navDrink(1)">Tiếp <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <!-- MODAL BẢNG 20 TOPPING -->
  <div class="modal-overlay" id="topping-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-boxes-stacked" style="color:var(--primary);"></i> 20+ Định Lượng Topping Chuẩn</div>
        <button class="btn-close-modal" onclick="closeToppingModal()">✕</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>STT</th><th style="text-align:left;">Tên Topping</th><th>Định Lượng</th></tr></thead>
          <tbody id="topping-modal-body"></tbody>
        </table>
      </div>
    </div>
  </div>

          { s: "TC Đường đen", pp: "[120]g / [2] vá", ca: "Bảo quản nhiệt độ thường" },
          { s: "TC Baby Hoàng kim", pp: "[100]g / [2] vá", ca: "Bảo quản nhiệt độ thường" },
          { s: "Kem vani", pp: "[60]g / [1] viên", ca: "Bảo quản tủ đông" },
          { s: "Đào miếng", pp: "[25]g / [5] miếng", ca: "Đã khui tủ mát 2 ngày" },
          { s: "Khoai Môn Nghiền", pp: "[80]g / 1 vá ([120]g / 1.5 viên)", ca: "Tủ mát 3 ngày" },
          { s: "Thạch đào / Dừa / Sương sáo / Aiyu", pp: "[80]g / [2] vá", ca: "Bát bảo / Trà đào múc 1 vá" },
          { s: "Hạt É", pp: "[60]g / [2] vá", ca: "Nhiệt độ thường 1 tháng" },
          { s: "Thạch Q / Củ năng / Lúa mạch", pp: "[40]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "Hạt Sen / TC Khoai môn", pp: "[50]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "3Q Trắng", pp: "[45]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "Thạch sữa viên / Sương sáo viên", pp: "[8] viên", ca: "Bảo quản tủ mát 3 ngày" },
          { s: "Kem cheese", pp: "[60] gram", ca: "Bảo quản tủ mát" },
          { s: "Bánh vuông đường đen (MỚI Bát bảo)", pp: "[25]g / nửa vá", ca: "Công thức mới 17/12/2025" },
          { s: "Trân châu củ năng (MỚI Bát bảo)", pp: "[25]g / nửa vá", ca: "Công thức mới 17/12/2025" }
        ],
        steps: [
          "Nhóm 2 vá (80g): Thạch đào, Thạch dừa, Sương sáo, Aiyu",
          "Nhóm 1 vá (40g): Thạch Q, Củ năng, Lúa mạch",
          "Nhóm 1 viên / miếng: Kem vani 60g, Đào 5 miếng 25g",
          "Nhóm đặc biệt: TCĐĐ 120g (2 vá), Hạt é 60g (2 vá)",
          "Bát bảo mới: Bánh vuông 25g + TC củ năng 25g"
        ],
        notes: "Mỗi nguyên vật liệu sau khi dùng xong phải trả lại ngay vào vị trí bảo quản.",
        hack: "💡 MẸO NHỚ: Topping 2 vá = 80g. Topping 1 vá củ năng/lúa mạch/thạch Q = 40g. Kem vani = 60g!"
      }
    ];

    let currentIdx = 0;
    let isBlindMode = false;
    let isClozeMode = false;
    let currentSteps = [];
    let selectedStepIdx = null;
    let learnedList = JSON.parse(localStorage.getItem('ngogia_learned') || '[]');

    function init() {
      const sel = document.getElementById('drink-selector');
      sel.innerHTML = '';
      DRINKS.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${d.name}`;
        sel.appendChild(opt);
      });

      const tb = document.getElementById('topping-modal-body');
      let tHtml = '';
      TOPPINGS_REF.forEach(t => {
        tHtml += `<tr><td>${t.id}</td><td style="text-align:left;"><strong>${t.name}</strong></td><td style="color:var(--primary); font-weight:800;">${t.val}</td></tr>`;
      });
      tb.innerHTML = tHtml;

      loadDrinkData();
      updateProgress();
    }

    function parseTemplate(str) {
      if (!str) return '';
      return str.replace(/\[(.*?)\]/g, (match, p1) => {
        if (isClozeMode) {
          return `<input type="text" class="cloze-input" data-ans="${p1}" oninput="checkCloze(this)" placeholder="?" autocomplete="off" autocorrect="off">`;
        } else if (isBlindMode) {
          return `<span class="maskable" onclick="this.classList.toggle('revealed')">${p1}</span>`;
        } else {
          return `<span class="val-highlight">${p1}</span>`;
        }
      });
    }

    function loadDrinkData() {
      const d = DRINKS[currentIdx];
      // Clone original steps
      currentSteps = [...d.steps];
      selectedStepIdx = null;
      renderCard();
    }

    function renderCard() {
      const d = DRINKS[currentIdx];
      const isLearned = learnedList.includes(d.id);
      const display = document.getElementById('card-display');
      document.getElementById('drink-selector').value = currentIdx;
      document.getElementById('card-counter').textContent = `${currentIdx + 1} / ${DRINKS.length}`;

      if (isBlindMode) display.classList.add('mode-blind');
      else display.classList.remove('mode-blind');

      const clozeBar = document.getElementById('cloze-bar');
      clozeBar.style.display = isClozeMode ? 'flex' : 'none';

      // Table M
      let trM = '';
      d.tableM.forEach(r => {
        trM += `<tr>
          <td style="color:var(--primary); font-weight:800;">${r.s}</td>
          <td>${parseTemplate(r.pp)}</td>
          <td>${parseTemplate(r.ca)}</td>
        </tr>`;
      });

      // Table L if any
      let tableLHtml = '';
      if (d.tableL) {
        let trL = '';
        d.tableL.forEach(r => {
          trL += `<tr>
            <td style="color:var(--primary); font-weight:800;">${r.s}</td>
            <td>${parseTemplate(r.pp)}</td>
            <td>${parseTemplate(r.ca)}</td>
          </tr>`;
        });
        tableLHtml = `
          <div class="section-block">
            <div class="section-title"><span>LY L (1000cc)</span></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Đường</th><th>Ly PP (Đá thường)</th><th>Ca (Ít/K.đá)</th></tr></thead>
                <tbody>${trL}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      display.innerHTML = `
        <div class="sheet-header">
          <div>
            <div class="sheet-title">${currentIdx + 1}. ${d.name}</div>
            <div class="sheet-tags">
              <span class="badge ${d.actionClass}">${parseTemplate(d.action)}</span>
              <span class="badge badge-size">${d.sizes}</span>
            </div>
          </div>
          <button class="btn-fav ${isLearned ? 'learned' : ''}" onclick="toggleLearned('${d.id}')">
            <i class="fa-solid fa-star"></i> <span>${isLearned ? 'Đã thuộc' : 'Chưa thuộc'}</span>
          </button>
        </div>

        <!-- MỨC ĐÁ -->
        <div class="section-block">
          <div class="section-title"><span>QUY CHUẨN ĐÁ:</span></div>
          <div style="font-size:0.78rem; line-height:1.45; color:#334155; font-weight:700;">
            ${parseTemplate(d.ice)}
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG M -->
        <div class="section-block">
          <div class="section-title"><span>${d.id === 'topping_master' ? 'ĐỊNH LƯỢNG TOPPING' : 'LY M (700cc)'}</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>${d.id === 'topping_master' ? 'Topping' : 'Đường'}</th><th>${d.id === 'topping_master' ? 'Định Lượng' : 'Ly PP (Đá thường)'}</th><th>${d.id === 'topping_master' ? 'Ghi Chú' : 'Ca (Ít/K.đá)'}</th></tr></thead>
              <tbody>${trM}</tbody>
            </table>
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG L -->
        ${tableLHtml}

        <!-- QUY TRÌNH KÉO THẢ / CHẠM ĐỔI VỊ TRÍ HỌC THUỘC -->
        <div class="section-block">
          <div class="section-title">
            <span>QUY TRÌNH (KÉO THẢ / CHẠM ĐỔI CHỖ):</span>
            <button onclick="scrambleSteps()" style="background:#e0f2fe; color:var(--primary); border:none; padding:2px 6px; border-radius:5px; font-weight:800; font-size:0.68rem; cursor:pointer;"><i class="fa-solid fa-shuffle"></i> Đảo thứ tự</button>
          </div>
          <div class="steps-container" id="steps-box"></div>
          <div id="seq-feedback-box"></div>
        </div>

        <!-- LƯU Ý & MẸO -->
        ${d.notes ? `<div class="note-box"><i class="fa-solid fa-triangle-exclamation"></i> ${d.notes}</div>` : ''}
        <div class="hack-box">${d.hack}</div>
      `;

      renderStepsList();

      if (isClozeMode) updateClozeScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // RENDER DANH SÁCH BƯỚC QUY TRÌNH HỖ TRỢ KÉO THẢ & CHẠM ĐỔI CHỖ
    function renderStepsList() {
      const box = document.getElementById('steps-box');
      const d = DRINKS[currentIdx];
      let html = '';

      const isCorrectOrder = currentSteps.every((val, index) => val === d.steps[index]);

      currentSteps.forEach((st, idx) => {
        const isSelected = selectedStepIdx === idx;
        const correctClass = isCorrectOrder ? 'correct-seq' : '';
        html += `
          <div class="step-item ${isSelected ? 'selected' : ''} ${correctClass}" 
               draggable="true" 
               ondragstart="onDragStart(event, ${idx})" 
               ondragover="onDragOver(event)" 
               ondrop="onDrop(event, ${idx})"
               onclick="onStepClick(${idx})">
            <div class="step-left">
              <span class="drag-handle"><i class="fa-solid fa-bars"></i></span>
              <span>${st}</span>
            </div>
            <div class="step-arrows" onclick="event.stopPropagation()">
              <button class="btn-step-move" onclick="moveStep(${idx}, -1)">▲</button>
              <button class="btn-step-move" onclick="moveStep(${idx}, 1)">▼</button>
            </div>
          </div>
        `;
      });

      box.innerHTML = html;

      const fb = document.getElementById('seq-feedback-box');
      if (isCorrectOrder) {
        fb.innerHTML = `<div class="seq-feedback seq-correct"><i class="fa-solid fa-circle-check"></i> CHUẨN XÁC 100%! ĐÃ ĐÚNG THỨ TỰ QUY TRÌNH!</div>`;
      } else {
        fb.innerHTML = `<div class="seq-feedback seq-scrambled"><i class="fa-solid fa-hand-pointer"></i> Chạm 2 bước bất kỳ để đổi chỗ (hoặc bấm ▲/▼) để xếp đúng!</div>`;
      }
    }

    // ĐẢO THỨ TỰ BƯỚC ĐỂ LUYỆN TẬP
    function scrambleSteps() {
      selectedStepIdx = null;
      currentSteps.sort(() => Math.random() - 0.5);
      renderStepsList();
    }

    // CHẠM 2 THẺ ĐỂ HOÁN ĐỔI TRÊN ĐIỆN THOẠI
    function onStepClick(idx) {
      if (selectedStepIdx === null) {
        selectedStepIdx = idx;
      } else {
        if (selectedStepIdx !== idx) {
          const temp = currentSteps[selectedStepIdx];
          currentSteps[selectedStepIdx] = currentSteps[idx];
          currentSteps[idx] = temp;
        }
        selectedStepIdx = null;
      }
      renderStepsList();
    }

    // NÚT MŨI TÊN DI CHUYỂN
    function moveStep(idx, dir) {
      const target = idx + dir;
      if (target >= 0 && target < currentSteps.length) {
        const temp = currentSteps[idx];
        currentSteps[idx] = currentSteps[target];
        currentSteps[target] = temp;
        selectedStepIdx = null;
        renderStepsList();
      }
    }

    // KÉO THẢ TRÊN MÁY TÍNH & TRÌNH DUYỆT
    let draggedIdx = null;
    function onDragStart(e, idx) {
      draggedIdx = idx;
      e.dataTransfer.setData('text/plain', idx);
    }
    function onDragOver(e) {
      e.preventDefault();
    }
    function onDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedIdx !== null && draggedIdx !== targetIdx) {
        const item = currentSteps.splice(draggedIdx, 1)[0];
        currentSteps.splice(targetIdx, 0, item);
        draggedIdx = null;
        selectedStepIdx = null;
        renderStepsList();
      }
    }

    // BẬT / TẮT CHẾ ĐỘ CHE SỐ VÀ ĐỤC LỖ
    function toggleMode(mode) {
      if (mode === 'blind') {
        isBlindMode = !isBlindMode;
        if (isBlindMode) isClozeMode = false;
      } else if (mode === 'cloze') {
        isClozeMode = !isClozeMode;
        if (isClozeMode) isBlindMode = false;
      }

      document.getElementById('btn-toggle-blind').classList.toggle('active-blind', isBlindMode);
      document.getElementById('btn-toggle-cloze').classList.toggle('active-cloze', isClozeMode);

      renderCard();
    }

    // SO SÁNH ĐỤC LỖ TỰ ĐỘNG
    function checkCloze(input) {
      const val = input.value.trim().toLowerCase();
      const ans = input.getAttribute('data-ans').trim().toLowerCase();

      if (!val) {
        input.classList.remove('correct', 'wrong');
        updateClozeScore();
        return;
      }

      const cleanVal = removeDiacritics(val);
      const cleanAns = removeDiacritics(ans);

      const isMatch = (val === ans) || (cleanVal === cleanAns) || 
                      (cleanAns.includes(cleanVal) && cleanVal.length >= 2);

      if (isMatch) {
        input.classList.add('correct');
        input.classList.remove('wrong');
      } else {
        input.classList.add('wrong');
        input.classList.remove('correct');
      }

      updateClozeScore();
    }

    function removeDiacritics(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
    }

    function updateClozeScore() {
      const inputs = document.querySelectorAll('.cloze-input');
      const correct = document.querySelectorAll('.cloze-input.correct');
      document.getElementById('cloze-score-text').innerHTML = `Đúng: <strong>${correct.length} / ${inputs.length} ô</strong>`;
    }

    function showClozeAnswers() {
      document.querySelectorAll('.cloze-input').forEach(inp => {
        inp.value = inp.getAttribute('data-ans');
        inp.classList.add('correct');
        inp.classList.remove('wrong');
      });
      updateClozeScore();
    }

    function resetClozeInputs() {
      document.querySelectorAll('.cloze-input').forEach(inp => {
        inp.value = '';
        inp.classList.remove('correct', 'wrong');
      });
      updateClozeScore();
    }

    function navDrink(step) {
      currentIdx += step;
      if (currentIdx < 0) currentIdx = DRINKS.length - 1;
      if (currentIdx >= DRINKS.length) currentIdx = 0;
      loadDrinkData();
    }

    function jumpToDrink(idx) {
      currentIdx = parseInt(idx);
      loadDrinkData();
    }

    function toggleLearned(id) {
      if (learnedList.includes(id)) {
        learnedList = learnedList.filter(item => item !== id);
      } else {
        learnedList.push(id);
      }
      localStorage.setItem('ngogia_learned', JSON.stringify(learnedList));
      updateProgress();
      renderCard();
    }

    function updateProgress() {
      const count = learnedList.length;
      const total = DRINKS.length;
      const pct = Math.round((count / total) * 100);
      document.getElementById('card-counter').textContent = `${currentIdx + 1} / ${total}`;
    }

    function openToppingModal() { document.getElementById('topping-modal').style.display = 'flex'; }
    function closeToppingModal() { document.getElementById('topping-modal').style.display = 'none'; }
    function closeModalOnOverlay(e) { if (e.target.id === 'topping-modal') closeToppingModal(); }

    window.onload = init;
  </script>
</body>
</html>
