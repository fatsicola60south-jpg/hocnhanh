<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bản quyền của PHÁT - SOP Ngô Gia Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0267b5;
      --primary-dark: #0a385c;
      --accent: #0284c7;
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white; padding: 10px 14px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(2, 103, 181, 0.25);
    }
    .header-box { display: flex; align-items: center; justify-content: space-between; max-width: 650px; margin: 0 auto; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .brand-logo {
      background: white; color: var(--primary); width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.25rem; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .brand-title { font-size: 0.98rem; font-weight: 900; letter-spacing: -0.3px; line-height: 1.2; }
    .brand-sub { font-size: 0.68rem; color: #7dd3fc; font-weight: 600; }

    .btn-top-topping {
      background: #38bdf8; color: #082f49; border: none; padding: 6px 12px; border-radius: 20px;
      font-size: 0.74rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    .container { padding: 10px 12px; max-width: 650px; margin: 0 auto; }

    /* CONTROLS BAR: CHỌN MÓN & 2 NÚT HỌC THUỘC GỌN GÀNG */
    .top-controls {
      background: white; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px;
      border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .search-select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 0.88rem; font-weight: 800; color: var(--primary-dark); background: white; outline: none; margin-bottom: 8px;
    }
    .tools-row {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .tool-btn {
      flex: 1; padding: 7px 6px; border-radius: 9px; border: 1.5px solid #cbd5e1; background: #f8fafc;
      font-size: 0.75rem; font-weight: 800; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.15s;
    }
    .tool-btn.active-blind { background: #fef3c7; border-color: var(--warning); color: #b45309; }
    .tool-btn.active-cloze { background: #f3e8ff; border-color: #8b5cf6; color: #6b21a8; }

    /* THANH TRẠNG THÁI KHI BẬT ĐỤC LỖ */
    .cloze-bar {
      display: none; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 10px;
      padding: 6px 10px; margin-bottom: 10px; font-size: 0.78rem; font-weight: 800; color: #6b21a8;
      align-items: center; justify-content: space-between;
    }
    .cloze-btns { display: flex; gap: 4px; }
    .btn-cloze-sub {
      background: #8b5cf6; color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; font-weight: 800; cursor: pointer;
    }

    /* RECIPE CARD */
    .recipe-sheet {
      background: white; border-radius: 16px; border: 1.5px solid #cbd5e1; padding: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .sheet-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 12px;
    }
    .sheet-title { font-size: 1.15rem; font-weight: 900; color: var(--primary-dark); line-height: 1.25; }
    .sheet-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px;
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    }
    .badge-no-shake { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-shake { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-stir { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-size { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .btn-fav {
      background: #f8fafc; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 6px 10px; font-size: 0.72rem; font-weight: 800; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .btn-fav.learned { background: #ecfdf5; border-color: var(--success); color: var(--success); }

    /* SECTIONS */
    .section-block { margin-bottom: 12px; }
    .section-title {
      font-size: 0.74rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
    }

    /* TABLES */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { background: #f0f7ff; color: var(--primary-dark); padding: 7px 8px; border: 1px solid #e2e8f0; font-weight: 800; text-align: left; white-space: nowrap; }
    td { padding: 6px 8px; border: 1px solid #e2e8f0; font-weight: 700; color: #1e293b; }
    tr:nth-child(even) td { background: #fbfdff; }

    /* BOXES */
    .proc-box {
      background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 10px 12px;
      font-size: 0.83rem; font-weight: 700; color: #1e293b; line-height: 1.55;
    }
    .note-box {
      background: #fffbeb; border-left: 4px solid var(--warning); border-radius: 8px; padding: 8px 10px;
      font-size: 0.78rem; font-weight: 700; color: #92400e; margin-top: 8px; line-height: 1.45;
    }
    .hack-box {
      background: #eff6ff; border-left: 4px solid var(--primary); border-radius: 8px; padding: 8px 10px;
      font-size: 0.78rem; font-weight: 800; color: var(--primary-dark); margin-top: 8px; line-height: 1.45;
    }

    /* SỐ BÌNH THƯỜNG */
    .val-highlight { font-weight: 800; color: var(--primary); }

    /* HIỆU ỨNG CHE SỐ TỰ HỌC */
    .mode-blind .maskable {
      background: #e2e8f0 !important; color: transparent !important; user-select: none;
      border-radius: 4px; cursor: pointer; position: relative; display: inline-block; min-width: 38px; text-align: center; padding: 0 4px;
    }
    .mode-blind .maskable::after {
      content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #64748b; font-weight: 900; font-size: 0.78rem;
    }
    .mode-blind .maskable.revealed {
      background: #dcfce7 !important; color: #065f46 !important;
    }
    .mode-blind .maskable.revealed::after { content: ""; }

    /* HIỆU ỨNG ĐỤC LỖ TRỰC TIẾP (GÕ ĐÚNG XANH - SAI ĐỎ) */
    .cloze-input {
      border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 3px 4px; font-size: 0.82rem; font-weight: 800;
      color: #0f172a; text-align: center; width: 62px; outline: none; background: #fff; transition: 0.15s;
    }
    .cloze-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(2,132,199,0.2); }
    .cloze-input.correct {
      background: #dcfce7 !important; border-color: #10b981 !important; color: #065f46 !important; box-shadow: 0 0 0 2px rgba(16,185,129,0.25);
    }
    .cloze-input.wrong {
      background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
    }

    /* BOTTOM BAR */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: white;
      border-top: 1.5px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.08); max-width: 650px; margin: 0 auto;
    }
    .nav-btn {
      padding: 10px 16px; border-radius: 12px; border: none; font-weight: 800; font-size: 0.85rem;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .nav-btn-prev { background: #f1f5f9; color: #334155; }
    .nav-btn-next { background: var(--primary); color: white; }
    .nav-counter { font-size: 0.82rem; font-weight: 900; color: var(--primary-dark); }

    /* MODAL TOPPING POPUP */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65);
      z-index: 2000; display: none; align-items: center; justify-content: center; padding: 14px;
      backdrop-filter: blur(3px);
    }
    .modal-box {
      background: white; border-radius: 16px; width: 100%; max-width: 550px; max-height: 85vh;
      overflow-y: auto; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
      border-bottom: 1.5px solid #e2e8f0; padding-bottom: 8px;
    }
    .modal-title { font-size: 1rem; font-weight: 900; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
    .btn-close-modal { background: #e2e8f0; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: 900; cursor: pointer; color: #475569; }
  </style>
</head>
<body>

  <header>
    <div class="header-box">
      <div class="header-left">
        <div class="brand-logo">吳</div>
        <div>
          <div class="brand-title">Bản quyền của PHÁT</div>
          <div class="brand-sub">Tránh xa tủ đông cùng Phát nhé</div>
        </div>
      </div>
      <button class="btn-top-topping" onclick="openToppingModal()">
        <i class="fa-solid fa-boxes-stacked"></i> <span>20 Topping</span>
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- TOP CONTROLS: CHỌN MÓN + NÚT BẬT CHE SỐ / ĐỤC LỖ -->
    <div class="top-controls">
      <select id="drink-selector" class="search-select" onchange="jumpToDrink(this.value)"></select>
      
      <div class="tools-row">
        <button class="tool-btn" id="btn-toggle-blind" onclick="toggleMode('blind')">
          <i class="fa-solid fa-eye-slash"></i> <span>Che Số (Chạm xem)</span>
        </button>
        <button class="tool-btn" id="btn-toggle-cloze" onclick="toggleMode('cloze')">
          <i class="fa-solid fa-pen-to-square"></i> <span>Đục Lỗ Trực Tiếp</span>
        </button>
      </div>
    </div>

    <!-- THANH KẾT QUẢ KHI ĐANG ĐỤC LỖ -->
    <div class="cloze-bar" id="cloze-bar">
      <div><i class="fa-solid fa-pen-nib"></i> <span id="cloze-score-text">Đúng: 0 / 0 ô</span></div>
      <div class="cloze-btns">
        <button class="btn-cloze-sub" onclick="showClozeAnswers()"><i class="fa-solid fa-key"></i> Đáp Án</button>
        <button class="btn-cloze-sub" style="background:#e2e8f0; color:#334155;" onclick="resetClozeInputs()"><i class="fa-solid fa-rotate-left"></i> Xóa</button>
      </div>
    </div>

    <!-- THẺ CÔNG THỨC DUY NHẤT TRÊN 1 TRANG -->
    <div id="card-display" class="recipe-sheet"></div>

  </div>

  <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
  <div class="bottom-bar">
    <button class="nav-btn nav-btn-prev" onclick="navDrink(-1)"><i class="fa-solid fa-arrow-left"></i> Trước</button>
    <div class="nav-counter" id="card-counter">1 / 27</div>
    <button class="nav-btn nav-btn-next" onclick="navDrink(1)">Tiếp <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <!-- POPUP BẢNG 20 TOPPING CHUẨN ĐẦY ĐỦ -->
  <div class="modal-overlay" id="topping-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-boxes-stacked" style="color:var(--primary);"></i> Bảng 20+ Định Lượng Topping Chuẩn</div>
        <button class="btn-close-modal" onclick="closeToppingModal()">✕</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>STT</th><th>Tên Topping</th><th>Định lượng / Khẩu phần</th></tr></thead>
          <tbody id="topping-modal-body"></tbody>
        </table>
      </div>
      <div style="font-size:0.75rem; color:#64748b; margin-top:8px;"><em>* Trích xuất theo chuẩn SOP Trang 6 & Thông báo công thức mới 004-1225/TB-HTNG.</em></div>
    </div>
  </div>

        id: "latte_bi_dao",
        name: "Bí Đao Latte / Vải Thiều Latte",
        sizes: "Ly M (700cc) & Ly L (1000cc)",
        action: "[Khuấy đều]",
        actionClass: "badge-stir",
        ice_M: "Đá đầy ly • Ít đá vạch [600]ml",
        ice_L: "Đá đầy ly • Ít đá vạch [800]ml",
        tableM: [
          { s: "100%", pp: "[120]ml sữa tươi + [5]cc nước đường + [250]ml cốt trà bí đao/vải", ca: "Giảm tối đa 70% đường" },
          { s: "70%", pp: "120ml sữa tươi + (0cc đường) + [250]ml cốt trà bí đao/vải", ca: "Giảm tối đa 70% đường" }
        ],
        tableL: [
          { s: "100%", pp: "[150]ml sữa tươi + [10]cc nước đường + [350]ml cốt trà bí đao/vải", ca: "Giảm tối đa 70% đường" },
          { s: "70%", pp: "150ml sữa tươi + (0cc đường) + [350]ml cốt trà bí đao/vải", ca: "Giảm tối đa 70% đường" }
        ],
        procedure: "Sữa tươi và nước đường vào ca định lượng khuấy đều rót vào ly PP → cho [250]ml cốt trà bí đao/vải → cho đá vào ly PP.",
        notes: "Ghi chú: Bí đao latte, Vải thiều latte GIẢM TỐI ĐA 70% ĐƯỜNG (chỉ có 2 mức 100% và 70%).",
        hack: "💡 MẸO NHỚ: Giống Hồng Trà Latte nhưng CHỈ CÓ 2 MỨC ĐƯỜNG (100% và 70%)!"
      },

      // 26. TRÀ CHANH VẢI THIỀU / BÍ ĐAO CHANH
      {
        id: "tra_chanh_codinh",
        name: "Trà Chanh Vải Thiều / Bí Đao Chanh",
        sizes: "Ly M (700cc) & Ly L (1000cc)",
        action: "[Lắc trước khi ra món]",
        actionClass: "badge-shake",
        ice_M: "Đá vạch [600]ml • Không đá: ca [350]ml",
        ice_L: "Đá vạch [800]ml • Không đá: ca [500]ml",
        tableM: [
          { s: "100%", pp: "[20]cc cốt chanh + [10]cc đường + [2] lát chanh + Trà châm đầy ly", ca: "Cố định 100% đường" }
        ],
        tableL: [
          { s: "100%", pp: "[25]cc cốt chanh + [15]cc đường + [2] lát chanh + Trà châm đầy ly", ca: "Cố định 100% đường" }
        ],
        procedure: "Cho đá vào ly PP → Nước chanh → Nước đường → 2 lát chanh tươi → Cho trà vải/bí đao vào ly PP → Lắc.",
        notes: "Cố định 100% độ đường. Cốt chanh và nước đường giống Trà Chanh thường.",
        hack: "💡 MẸO NHỚ: Chanh & đường y chang Trà chanh thường (20-10 và 25-15) nhưng dùng trà vải/bí đao CỐ ĐỊNH ĐƯỜNG!"
      },

      // 27. BẢNG 20 ĐỊNH LƯỢNG TOPPING CHUẨN
      {
        id: "topping_master",
        name: "BẢNG ĐỊNH LƯỢNG TOPPING TOÀN DIỆN (Trang 6 & Mới)",
        sizes: "Áp dụng toàn bộ hệ thống HTNG",
        action: "[Chuẩn từng gram]",
        actionClass: "badge-no-shake",
        ice_M: "Bảo quản đúng nhiệt độ tủ mát (0-6°) hoặc tủ đông (-5~-22°)",
        tableM: [
          { s: "Pudding", pp: "[100]g / 1 hủ", ca: "Dùng ngay trong ca" },
          { s: "TC Đường đen", pp: "[120]g / [2] vá", ca: "Bảo quản nhiệt độ thường" },
          { s: "TC Baby Hoàng kim", pp: "[100]g / [2] vá", ca: "Bảo quản nhiệt độ thường" },
          { s: "Kem vani", pp: "[60]g / [1] viên", ca: "Bảo quản tủ đông" },
          { s: "Đào miếng", pp: "[25]g / [5] miếng", ca: "Đã khui tủ mát 2 ngày" },
          { s: "Khoai Môn Nghiền", pp: "[80]g / 1 vá ([120]g / 1.5 viên)", ca: "Tủ mát 3 ngày" },
          { s: "Thạch đào / Dừa / Sương sáo / Aiyu", pp: "[80]g / [2] vá", ca: "Bát bảo / Trà đào múc 1 vá" },
          { s: "Hạt É", pp: "[60]g / [2] vá", ca: "Nhiệt độ thường 1 tháng" },
          { s: "Thạch Q / Củ năng / Lúa mạch", pp: "[40]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "Hạt Sen / TC Khoai môn", pp: "[50]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "3Q Trắng", pp: "[45]g / [1] vá", ca: "Bảo quản tủ mát" },
          { s: "Thạch sữa viên / Sương sáo viên", pp: "[8] viên", ca: "Bảo quản tủ mát 3 ngày" },
          { s: "Kem cheese", pp: "[60] gram", ca: "Bảo quản tủ mát" },
          { s: "Bánh vuông đường đen (MỚI Bát bảo)", pp: "[25]g / nửa vá", ca: "Công thức mới 17/12/2025" },
          { s: "Trân châu củ năng (MỚI Bát bảo)", pp: "[25]g / nửa vá", ca: "Công thức mới 17/12/2025" }
        ],
        procedure: "Mỗi nguyên vật liệu sau khi sử dụng xong phải trả lại ngay vào vị trí bảo quản và tuân thủ nguyên tắc 'nhập trước xuất trước' và 'định vị rõ ràng'.",
        notes: "Tất cả trọng lượng là giá trị trung bình cho mỗi phần. Cửa hàng cần thường xuyên tự kiểm tra trọng lượng.",
        hack: "💡 MẸO NHỚ NHANH: Topping 2 vá = 80g (Thạch đào, dừa, sương sáo, aiyu). Topping 1 vá củ năng/lúa mạch/thạch Q = 40g. Kem vani = 60g!"
      }
    ];

    let currentIdx = 0;
    let isBlindMode = false;
    let isClozeMode = false;
    let learnedList = JSON.parse(localStorage.getItem('ngogia_learned') || '[]');

    function init() {
      // Build dropdown options
      const sel = document.getElementById('drink-selector');
      sel.innerHTML = '';
      DRINKS.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${d.name}`;
        sel.appendChild(opt);
      });

      // Build topping modal table
      const tb = document.getElementById('topping-modal-body');
      let tHtml = '';
      TOPPINGS_REF.forEach(t => {
        tHtml += `<tr><td>${t.id}</td><td><strong>${t.name}</strong></td><td style="color:var(--primary); font-weight:800;">${t.val}</td></tr>`;
      });
      tb.innerHTML = tHtml;

      renderCard();
      updateProgress();
    }

    // CHUYỂN ĐỔI CHUỖI CÓ CHỨA [ĐÁP_ÁN] THEO CHẾ ĐỘ HIỆN TẠI
    function parseTemplate(str) {
      if (!str) return '';
      return str.replace(/\[(.*?)\]/g, (match, p1) => {
        if (isClozeMode) {
          const width = Math.max(50, p1.length * 10 + 14);
          return `<input type="text" class="cloze-input" data-ans="${p1}" oninput="checkCloze(this)" style="width:${width}px;" placeholder="?" autocomplete="off" autocorrect="off">`;
        } else if (isBlindMode) {
          return `<span class="maskable" onclick="this.classList.toggle('revealed')">${p1}</span>`;
        } else {
          return `<span class="val-highlight">${p1}</span>`;
        }
      });
    }

    function renderCard() {
      const d = DRINKS[currentIdx];
      const isLearned = learnedList.includes(d.id);
      const display = document.getElementById('card-display');
      document.getElementById('drink-selector').value = currentIdx;
      document.getElementById('card-counter').textContent = `${currentIdx + 1} / ${DRINKS.length}`;

      // Update Blind mode class on card wrapper
      if (isBlindMode) {
        display.classList.add('mode-blind');
      } else {
        display.classList.remove('mode-blind');
      }

      // Show/Hide Cloze status bar
      const clozeBar = document.getElementById('cloze-bar');
      if (isClozeMode) {
        clozeBar.style.display = 'flex';
      } else {
        clozeBar.style.display = 'none';
      }

      // Render Table M
      let trM = '';
      d.tableM.forEach(r => {
        trM += `<tr>
          <td style="color:var(--primary);">${r.s}</td>
          <td>${parseTemplate(r.pp)}</td>
          <td>${parseTemplate(r.ca)}</td>
        </tr>`;
      });

      // Render Table L if exists
      let tableLHtml = '';
      if (d.tableL) {
        let trL = '';
        d.tableL.forEach(r => {
          trL += `<tr>
            <td style="color:var(--primary);">${r.s}</td>
            <td>${parseTemplate(r.pp)}</td>
            <td>${parseTemplate(r.ca)}</td>
          </tr>`;
        });
        tableLHtml = `
          <div class="section-block">
            <div class="section-title"><i class="fa-solid fa-glass-water" style="color:var(--accent);"></i> ĐỊNH LƯỢNG LY L (1000cc) - CÁC MỨC ĐƯỜNG:</div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Đường</th><th>Rót Ly PP (Đá thường)</th><th>Ca Đong (Ít/Không đá)</th></tr></thead>
                <tbody>${trL}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      display.innerHTML = `
        <div class="sheet-header">
          <div>
            <div class="sheet-title">${currentIdx + 1}. ${d.name}</div>
            <div class="sheet-tags">
              <span class="badge ${d.actionClass}">${parseTemplate(d.action)}</span>
              <span class="badge badge-size">${d.sizes}</span>
            </div>
          </div>
          <button class="btn-fav ${isLearned ? 'learned' : ''}" onclick="toggleLearned('${d.id}')">
            <i class="fa-solid fa-star"></i> <span>${isLearned ? 'Đã thuộc' : 'Chưa thuộc'}</span>
          </button>
        </div>

        <!-- MỨC ĐÁ -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-snowflake" style="color:var(--accent);"></i> QUY CHUẨN ĐÁ & RÓT LY:</div>
          <div style="font-size:0.83rem; line-height:1.6; color:#334155;">
            <strong>• Ly M:</strong> ${parseTemplate(d.ice_M)}<br>
            ${d.ice_L ? `<strong>• Ly L:</strong> ${parseTemplate(d.ice_L)}` : ''}
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG LY M -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-cubes-stacked" style="color:var(--primary);"></i> ${d.id === 'topping_master' ? 'DANH SÁCH ĐỊNH LƯỢNG TOPPING' : 'ĐỊNH LƯỢNG LY M (700cc) - CÁC MỨC ĐƯỜNG:'}</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>${d.id === 'topping_master' ? 'Topping' : 'Đường'}</th><th>${d.id === 'topping_master' ? 'Định Lượng Chuẩn' : 'Rót Ly PP (Đá thường)'}</th><th>${d.id === 'topping_master' ? 'Ghi Chú Vận Hành' : 'Ca Đong (Ít/Không đá)'}</th></tr></thead>
              <tbody>${trM}</tbody>
            </table>
          </div>
        </div>

        <!-- BẢNG ĐƯỜNG LY L NẾU CÓ -->
        ${tableLHtml}

        <!-- QUY TRÌNH -->
        <div class="section-block">
          <div class="section-title"><i class="fa-solid fa-list-ol" style="color:var(--success);"></i> TRÌNH TỰ THAO TÁC CHUẨN:</div>
          <div class="proc-box">${parseTemplate(d.procedure)}</div>
        </div>

        <!-- LƯU Ý & MẸO NHỚ -->
        ${d.notes ? `<div class="note-box"><i class="fa-solid fa-triangle-exclamation"></i> <strong>LƯU Ý:</strong> ${d.notes}</div>` : ''}
        <div class="hack-box"><i class="fa-solid fa-lightbulb"></i> ${d.hack}</div>
      `;

      if (isClozeMode) {
        updateClozeScore();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // CHUYỂN BẬT / TẮT CHẾ ĐỘ HỌC
    function toggleMode(mode) {
      if (mode === 'blind') {
        isBlindMode = !isBlindMode;
        if (isBlindMode) isClozeMode = false; // Tắt đục lỗ nếu bật che số
      } else if (mode === 'cloze') {
        isClozeMode = !isClozeMode;
        if (isClozeMode) isBlindMode = false; // Tắt che số nếu bật đục lỗ
      }

      // Cập nhật trạng thái nút
      const btnBlind = document.getElementById('btn-toggle-blind');
      const btnCloze = document.getElementById('btn-toggle-cloze');

      if (isBlindMode) {
        btnBlind.classList.add('active-blind');
      } else {
        btnBlind.classList.remove('active-blind');
      }

      if (isClozeMode) {
        btnCloze.classList.add('active-cloze');
      } else {
        btnCloze.classList.remove('active-cloze');
      }

      renderCard();
    }

    // KIỂM TRA ĐỤC LỖ TRỰC TIẾP
    function checkCloze(input) {
      const val = input.value.trim().toLowerCase();
      const ans = input.getAttribute('data-ans').trim().toLowerCase();

      if (!val) {
        input.classList.remove('correct', 'wrong');
        updateClozeScore();
        return;
      }

      const cleanVal = removeDiacritics(val);
      const cleanAns = removeDiacritics(ans);

      const isMatch = (val === ans) || (cleanVal === cleanAns) || 
                      (cleanAns.includes(cleanVal) && cleanVal.length >= 2);

      if (isMatch) {
        input.classList.add('correct');
        input.classList.remove('wrong');
      } else {
        input.classList.add('wrong');
        input.classList.remove('correct');
      }

      updateClozeScore();
    }

    function removeDiacritics(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
    }

    function updateClozeScore() {
      const inputs = document.querySelectorAll('.cloze-input');
      const correct = document.querySelectorAll('.cloze-input.correct');
      document.getElementById('cloze-score-text').innerHTML = `Đúng: <strong>${correct.length} / ${inputs.length} ô</strong>`;
    }

    function showClozeAnswers() {
      document.querySelectorAll('.cloze-input').forEach(inp => {
        inp.value = inp.getAttribute('data-ans');
        inp.classList.add('correct');
        inp.classList.remove('wrong');
      });
      updateClozeScore();
    }

    function resetClozeInputs() {
      document.querySelectorAll('.cloze-input').forEach(inp => {
        inp.value = '';
        inp.classList.remove('correct', 'wrong');
      });
      updateClozeScore();
    }

    function navDrink(step) {
      currentIdx += step;
      if (currentIdx < 0) currentIdx = DRINKS.length - 1;
      if (currentIdx >= DRINKS.length) currentIdx = 0;
      renderCard();
    }

    function jumpToDrink(idx) {
      currentIdx = parseInt(idx);
      renderCard();
    }

    function toggleLearned(id) {
      if (learnedList.includes(id)) {
        learnedList = learnedList.filter(item => item !== id);
      } else {
        learnedList.push(id);
      }
      localStorage.setItem('ngogia_learned', JSON.stringify(learnedList));
      updateProgress();
      renderCard();
    }

    function updateProgress() {
      const count = learnedList.length;
      const total = DRINKS.length;
      const pct = Math.round((count / total) * 100);
      document.getElementById('learned-progress').style.width = pct + '%';
      document.getElementById('learned-count').textContent = `${count}/${total} (${pct}%)`;
    }

    // MODAL TOPPING LOGIC
    function openToppingModal() {
      document.getElementById('topping-modal').style.display = 'flex';
    }
    function closeToppingModal() {
      document.getElementById('topping-modal').style.display = 'none';
    }
    function closeModalOnOverlay(e) {
      if (e.target.id === 'topping-modal') closeToppingModal();
    }

    window.onload = init;
  </script>
</body>
</html>
